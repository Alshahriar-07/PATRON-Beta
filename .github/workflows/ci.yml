name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Syntax check
        run: python -m compileall -q src scripts examples

      - name: Tests (synthetic fixtures, no network)
        run: python -m pytest

      - name: Health check (WARN expected without data/checkpoint)
        run: python -m patron health

      - name: Health check JSON contract
        shell: bash
        run: |
          python -m patron health --json > health.json
          python -c "import json;d=json.load(open('health.json'));assert d['status'] in {'PASS','WARN'},d['status'];print(d['status'],d['counts'])"

      - name: CLI help surfaces
        run: |
          python -m patron --help
          python -m patron train --help
          python -m patron runtime --help
          python -m patron experiment --help

      - name: Experiment listing
        run: python -m patron experiment list

  security-scan:
    name: secret and artifact scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan repository
        run: python scripts/scan_release.py
      - name: Dependency consistency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

  package:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e . --no-deps
          python -m build --no-isolation --outdir dist/artifacts
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/artifacts/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ["patron/__main__.py", "patron/cli.py", "patron/health.py",
                      "patron/schemas/input.schema.json", "patron/schemas/output.schema.json"]
          missing = [r for r in required if r not in names]
          assert not missing, missing
          assert any(n.endswith("LICENSE") for n in names), "LICENSE missing from wheel"
          print(f"{wheel}: {len(names)} entries, schemas bundled")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/artifacts/*
          retention-days: 7
