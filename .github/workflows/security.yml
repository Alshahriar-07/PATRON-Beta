name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: secrets, private paths, oversized files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository scan
        run: python scripts/scan_release.py
      - name: Scan git history text blobs for obvious credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, re, sys
          patterns = {
              "aws": re.compile(rb"AKIA[0-9A-Z]{16}"),
              "github": re.compile(rb"gh[pousr]_[A-Za-z0-9]{20,}"),
              "private_key": re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
          }
          revs = subprocess.run(["git", "rev-list", "--all"], capture_output=True, text=True).stdout.split()
          hits = []
          for rev in revs:
              names = subprocess.run(["git", "ls-tree", "-r", "--name-only", rev],
                                     capture_output=True, text=True).stdout.splitlines()
              for name in names:
                  if name.endswith((".pt", ".parquet", ".db", ".zip", ".png")):
                      continue
                  blob = subprocess.run(["git", "show", f"{rev}:{name}"], capture_output=True).stdout
                  for label, pattern in patterns.items():
                      if pattern.search(blob):
                          hits.append((rev[:8], name, label))
          if hits:
              print("potential secrets in history:", hits)
              sys.exit(1)
          print(f"history scan clean across {len(revs)} commit(s)")
          PY

  dependencies:
    name: dependency consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: pip check
        run: python -m pip check
      - name: Record dependency inventory
        run: |
          python -m pip list --format=json > pip-inventory.json
          python -c "import json;d=json.load(open('pip-inventory.json'));print(len(d),'packages recorded')"
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: pip-inventory.json
          retention-days: 30
      # CVE auditing is intentionally manual: torch/CPU wheels and transitive
      # pins change often, and a failing advisory pipeline needs a human to
      # decide between upgrade and documented acceptance. Run `pip install
      # pip-audit && pip-audit` locally; see reports/security/security_audit.md.
